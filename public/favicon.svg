<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="coinGrad" x1="10" y1="12" x2="38" y2="40" gradientUnits="userSpaceOnUse">
