  <circle cx="21" cy="28" r="2" fill="#34D399" />
  
  <!-- AI Guiding Sparkle Star -->
  <path d="M 37 6 C 37 9.2 39.8 12 43 12 C 39.8 12 37 14.8 37 18 C 37 14.8 34.2 12 31 12 C 34.2 12 37 9.2 37 6 Z" fill="url(#starGrad)" />
